<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Angelica - Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #fdf2f8 60%, #ede7ff 100%);
        color: #2b2233;
        text-align: center;
        padding: 24px;
      }
      .heart {
        width: 64px; height: 64px;
        background: #ec4899;
        border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
        box-shadow: 0 12px 32px -8px rgba(124, 92, 224, 0.35);
      }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; font-size: 14px; color: #7a6b85; max-width: 340px; line-height: 1.5; }
      button {
        margin-top: 8px;
        border: none;
        background: #ec4899;
        color: white;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 14px;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 2px 16px -2px rgba(236, 72, 153, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="heart">💖</div>
    <h1>You're offline</h1>
    <p>My Angelica needs a connection to load your study content. Your progress is safe - check back once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
